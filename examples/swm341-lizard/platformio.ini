; Synwit SWM341 - 800x480 RGB LCD + LVGL 9.5 skeleton lizard, log over SEGGER RTT
;
;   pio run                build
;   pio run -t upload      flash with probe-rs and watch the RTT output
;
; Same board/wiring as examples/swm341-lvgl9.5-map. The lizard is rendered by a
; tiny RGB565 software rasterizer into an lv_canvas buffer living in the LVGL
; heap (SDRAM); LVGL then blits that canvas into one of the two framebuffers.

[env:swm341xe]
platform = synwit
framework = synwit
board = swm341xe

; 120 MHz from the 12 MHz XTAL -> LCD DOTCLK 30 MHz, ~62 Hz at 800x480.
board_build.synwit_clock = pll_xtal12m_120m

lib_deps =
    lvgl/lvgl@9.5.0
    git@github.com:SEGGERMicro/RTT.git

build_flags =
    -DSWM34S_LCM_PCBV=SWM34SRE_PIN64_A001
; GT911 panel: touch to steer the lizard, autonomous roaming when untouched.
; Set to 0 on boards without a GT911 (also avoids the I2C probe at boot).
    -DLIZARD_TOUCH=1
; sinf/cosf/sqrtf/atan2f for the skeletal gait
    -lm

upload_protocol = custom
upload_command = probe-rs run --chip swm341 --non-interactive $BUILD_DIR/${PROGNAME}.elf
