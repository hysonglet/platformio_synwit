; Synwit SWM320 - blink + printf over UART0, same wiring as the vendor samples
; (2 env(s): one per chip of this series)
;
;   pio run                 build every variant
;   pio run -e swm320xc      build one chip
;   pio device monitor      watch the output (57600 8N1)
;
; LED: PA5     UART0: TX=PA3  RX=PA2
; These are the pins of Synwit's own evaluation board; adapt them if your
; board routes the LED / UART0 elsewhere.

[env:swm320xc]
platform = synwit
framework = synwit
board = swm320xc
monitor_speed = 57600

[env:swm320xe]
platform = synwit
framework = synwit
board = swm320xe
monitor_speed = 57600
