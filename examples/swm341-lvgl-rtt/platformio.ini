; Synwit SWM341 - 800x480 RGB LCD + LVGL 8.3, console over SEGGER RTT
;
;   pio run                build
;   pio run -t upload      flash with probe-rs and watch the RTT output
;                          (probe-rs run stays attached: Ctrl-C to stop)
;   JLinkRTTViewer / SEGGER RTT Client on a second console also work
;
; Hardware: SWM34SRET6 LQFP64 on the 5" 800x480 board (SWDM-QFP64-34SREB2,
; panel WKS50089) - or any other SWM34S board with SDRAM. The two 800x480
; RGB565 framebuffers and LVGL's heap live in the SDRAM, the chip itself has
; only 64 KB of SRAM, far less than one frame.
;
; Wiring and panel timing are Synwit's own 800x480 demo. Pick your board with
; SWM34S_LCM_PCBV (see include/board_lcd.h) - the wrong one means a dark panel:
; the 64-pin board uses PB13 for the backlight and PB3/PB4 for HSYNC/DEN, the
; 100-pin boards use PD9 and PM8/PM11.

[env:swm341xe]
platform = synwit
framework = synwit
board = swm341xe

; 120 MHz from the 12 MHz XTAL. The board default (20 MHz internal RC) is far
; too slow for the panel: SYSCLK / ClkDiv 4 = 30 MHz DOTCLK, ~62 Hz at 800x480
; (the panel asks for 30 MHz typ. / 50 MHz max.). The vendor demo runs 150 MHz
; with ClkDiv 5 - same 30 MHz, use either.
board_build.synwit_clock = pll_xtal12m_120m

lib_deps =
    lvgl/lvgl@8.4.0
    git@github.com:SEGGERMicro/RTT.git

; lv_conf.h and SEGGER_RTT_Conf.h live in include/. The absolute path is
; needed because the libraries are compiled in their own env.
build_flags =
    -I$PROJECT_DIR/include
    -DSWM34S_LCM_PCBV=SWM34SRE_PIN64_A001


upload_protocol = custom
upload_command = probe-rs run --chip swm341 --non-interactive $BUILD_DIR/${PROGNAME}.elf
