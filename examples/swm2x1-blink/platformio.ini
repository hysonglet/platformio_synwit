; Synwit SWM2X1 - blink + printf over UART0, same wiring as the vendor samples
; (3 env(s): one per chip of this series)
;
;   pio run                 build every variant
;   pio run -e swm201x6      build one chip
;   pio device monitor      watch the output (57600 8N1)
;
; LED: PA5     UART0: TX=PA1  RX=PA0
; These are the pins of Synwit's own evaluation board; adapt them if your
; board routes the LED / UART0 elsewhere.

[env:swm201x6]
platform = synwit
framework = synwit
board = swm201x6
monitor_speed = 57600

[env:swm211x6]
platform = synwit
framework = synwit
board = swm211x6
monitor_speed = 57600

[env:swm211x8]
platform = synwit
framework = synwit
board = swm211x8
monitor_speed = 57600
