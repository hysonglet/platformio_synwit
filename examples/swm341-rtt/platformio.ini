; Synwit SWM341 - SEGGER RTT console over the on-chip debug probe
;
;   pio run                       build
;   pio run -t upload             flash
;   JLinkRTTViewer / JLinkRTTLogger / SEGGER RTT Client to read the output.
;   (`pio device monitor` shows nothing here - no UART is used at all.)
;
; No UART pins are used at all: output goes through the SWD/JTAG debug probe,
; so it costs ~1 kB of RAM (the RTT control block) and needs no extra wiring.

[env:swm341xe]
platform = synwit
framework = synwit
board = swm341xe

; SEGGER RTT, straight from SEGGER's repo. Pin it by appending "#<sha/tag>",
; e.g. git@github.com:SEGGERMicro/RTT.git#4d8feab
lib_deps = git@github.com:SEGGERMicro/RTT.git

; That repo has no library.json and no sources at its root, so PIO unpacks only
; the RTT/ subdirectory - which means Config/SEGGER_RTT_Conf.h is missing.
; It is an application file anyway, so this project ships its own in include/.
; An absolute path is needed because the library is built in its own env.
build_flags = -I$PROJECT_DIR/include
