; Synwit SWM341 - SEGGER RTT console over the on-chip debug probe
;
;   pio run                       build
;   pio run -t upload             flash
;   JLinkRTTViewer / JLinkRTTLogger / SEGGER RTT Client to read the output.
;   (`pio device monitor` shows nothing here - no UART is used at all.)
;
; No UART pins are used at all: output goes through the SWD/JTAG debug probe,
; so it costs ~1 kB of RAM (the RTT control block) and needs no extra wiring.

[env:swm341xe]
platform = synwit
framework = synwit
board = swm341xe

; SEGGER RTT, straight from SEGGER's repo. Pin it by appending "#<sha/tag>",
; e.g. git@github.com:SEGGERMicro/RTT.git#4d8feab
lib_deps = git@github.com:SEGGERMicro/RTT.git

; Flash with probe-rs (probe-rs 0.30 already ships a synwit/swm341 target:
; 512 KiB flash @0x0, 64 KiB RAM @0x20000000).
;
; `probe-rs run` flashes and then stays attached printing the RTT output, so
; `pio run -t upload` will NOT return on its own - stop it with Ctrl-C. It
; needs the ELF, not the .bin that $SOURCE points at.
upload_protocol = custom
upload_command = probe-rs run --chip swm341 --non-interactive $BUILD_DIR/${PROGNAME}.elf

; Prefer a command that just flashes and exits? Use probe-rs download instead:
;     probe-rs download --chip swm341 --binary-format bin --base-address 0x0 --verify --non-interactive $SOURCE
;
; Handy flags, pick what you need:
;   --probe VID:PID[:serial]   more than one debugger plugged in
;   --connect-under-reset      chip does not answer (SWD pins reused as GPIO,
;                              bad firmware, low-power state)
;   --speed 100                lower SWD clock if the link is flaky
;   --chip-erase               wipe the whole flash first
; Note the probe is exclusive: a running `probe-rs run` blocks every other
; probe-rs invocation with "could not be opened for exclusive access".

; That repo has no library.json and no sources at its root, so PIO unpacks only
; the RTT/ subdirectory - which means Config/SEGGER_RTT_Conf.h is missing.
; It is an application file anyway, so this project ships its own in include/.
; An absolute path is needed because the library is built in its own env.
build_flags = -I$PROJECT_DIR/include
