; Synwit SWM241 - blink + printf over UART0, same wiring as the vendor samples
; (1 env(s): one per chip of this series)
;
;   pio run                 build every variant
;   pio run -e swm241xb      build one chip
;   pio device monitor      watch the output (57600 8N1)
;
; LED: PA5     UART0: TX=PD14  RX=PD13
; These are the pins of Synwit's own evaluation board; adapt them if your
; board routes the LED / UART0 elsewhere.

[env:swm241xb]
platform = synwit
framework = synwit
board = swm241xb
monitor_speed = 57600
