; Synwit SWM181 - blink + printf over UART0, same wiring as the vendor samples
; (3 env(s): one per chip of this series)
;
;   pio run                 build every variant
;   pio run -e swm181x9      build one chip
;   pio device monitor      watch the output (57600 8N1)
;
; LED: PA5     UART0: TX=PA1  RX=PA0
; These are the pins of Synwit's own evaluation board; adapt them if your
; board routes the LED / UART0 elsewhere.

[env:swm181x9]
platform = synwit
framework = synwit
board = swm181x9
monitor_speed = 57600

[env:swm181xb]
platform = synwit
framework = synwit
board = swm181xb
monitor_speed = 57600

[env:swm181xc]
platform = synwit
framework = synwit
board = swm181xc
monitor_speed = 57600
